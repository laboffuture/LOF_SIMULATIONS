<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sensor-Based Escape Simulation · Shadow Triggered Escape Bot</title>
    <link rel="icon" type="image/png" href="../../../assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #eef6ff;
        --panel: #ffffff;
        --panel2: #f4f8ff;
        --line: #dbe6f5;
        --txt: #25324a;
        --mut: #5f6f8a;
        --dim: #93a2ba;
        --accent: #ff8fab;
        --accent2: #7cc6ff;
        --leaf: #7ac77a;
        --sun: #ffd84d;
        --ultra: #3fbfa8;
        --warn: #f7a23b;
        --danger: #ff6b81;
        --ok: #54c48a;
        --shadow: 0 12px 34px rgba(80, 110, 160, 0.14);
        --r: 20px;
        --head: "Orbitron", sans-serif;
        --body: "Rajdhani", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        font-family: var(--body);
        font-size: 15.5px;
        font-weight: 500;
        color: var(--txt);
        background:
          radial-gradient(900px 500px at 10% -5%, #fff6fb 0, transparent 60%),
          radial-gradient(900px 600px at 100% 0%, #eaf7ff 0, transparent 55%),
          linear-gradient(180deg, #f3f9ff, #eaf6ee);
        min-height: 100vh;
        padding: 22px clamp(12px, 3vw, 40px) 40px;
      }
      h1,
      h3,
      .tab,
      .badge,
      .action .big,
      .title p {
        font-family: var(--head);
      }
      header.top {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .logo {
        width: 52px;
        height: 52px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        font-size: 28px;
        background: linear-gradient(145deg, #fff, #eaf3ff);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
      }
      .title h1 {
        margin: 0;
        font-size: 21px;
        font-weight: 800;
        letter-spacing: 1px;
        color: #2b3a57;
      }
      .title p {
        margin: 4px 0 0;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.5px;
        color: var(--mut);
      }

      .tabs {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }
      .tab {
        cursor: pointer;
        border: 2px solid var(--line);
        background: #fff;
        padding: 13px 20px;
        border-radius: 16px;
        font-size: 13.5px;
        font-weight: 600;
        letter-spacing: 0.4px;
        color: var(--mut);
        display: flex;
        align-items: center;
        gap: 9px;
        transition: 0.18s;
        user-select: none;
        box-shadow: var(--shadow);
      }
      .tab:hover {
        transform: translateY(-2px);
        border-color: #bcd6f5;
      }
      .tab.active {
        color: #fff;
        border-color: transparent;
        background: linear-gradient(145deg, var(--accent2), #5ab0f5);
        box-shadow: 0 10px 24px rgba(90, 176, 245, 0.35);
      }
      .tab.light.active {
        background: linear-gradient(145deg, var(--sun), #ffbf3d);
        color: #5a4a12;
      }
      .tab.ultra.active {
        background: linear-gradient(145deg, var(--ultra), #279d88);
        box-shadow: 0 10px 24px rgba(63, 191, 168, 0.35);
      }

      .grid {
        display: grid;
        grid-template-columns: 300px 1fr 296px;
        gap: 18px;
        align-items: start;
      }
      @media (max-width: 1150px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--r);
        box-shadow: var(--shadow);
        padding: 20px;
      }
      .card h3 {
        margin: 0 0 4px;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        color: #2b3a57;
      }
      .card .sub {
        font-size: 14px;
        color: var(--mut);
        margin: 0 0 14px;
        line-height: 1.5;
      }

      .ctrl {
        margin: 18px 0;
      }
      .ctrl.sect {
        padding-top: 14px;
        border-top: 2px dashed var(--line);
      }
      .ctrl .row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 8px;
      }
      .ctrl label {
        font-size: 14.5px;
        font-weight: 600;
        color: var(--txt);
      }
      .ctrl .val {
        font-family: var(--head);
        font-size: 13px;
        color: #e0759a;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      input[type="range"] {
        -webkit-appearance: none;
        width: 100%;
        height: 10px;
        border-radius: 10px;
        outline: none;
        background: linear-gradient(90deg, var(--accent2), var(--accent))
          no-repeat;
        background-size: var(--fill, 50%) 100%;
        box-shadow: inset 0 0 0 2px var(--line);
        cursor: pointer;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #fff;
        border: 4px solid var(--accent2);
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.18);
        cursor: grab;
      }
      input[type="range"]::-moz-range-thumb {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #fff;
        border: 4px solid var(--accent2);
        cursor: grab;
      }
      .hint {
        font-size: 12.5px;
        color: var(--dim);
        margin-top: 6px;
        line-height: 1.4;
      }

      .toggle {
        display: flex;
        gap: 10px;
        margin-top: 6px;
      }
      .toggle button {
        flex: 1;
        cursor: pointer;
        border: 2px solid var(--line);
        background: #fff;
        color: var(--mut);
        padding: 12px;
        border-radius: 14px;
        font-size: 13.5px;
        font-weight: 600;
        transition: 0.15s;
        font-family: var(--body);
      }
      .toggle button.on {
        color: #fff;
        border-color: transparent;
        background: linear-gradient(145deg, var(--danger), #ff5470);
        box-shadow: 0 8px 18px rgba(255, 107, 129, 0.32);
      }
      .toggle button.on.safe {
        background: linear-gradient(145deg, var(--ok), #3fb87a);
        box-shadow: 0 8px 18px rgba(84, 196, 138, 0.3);
      }
      canvas {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 16px;
        background: #cdeafc;
      }
      .stage-foot {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 14px;
        justify-content: center;
      }
      .btn {
        cursor: pointer;
        border: 2px solid var(--line);
        background: #fff;
        color: var(--txt);
        padding: 11px 17px;
        border-radius: 14px;
        font-size: 13.5px;
        font-weight: 600;
        transition: 0.15s;
        font-family: var(--body);
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .btn:hover {
        transform: translateY(-2px);
        border-color: #bcd6f5;
      }
      .btn.sun {
        background: linear-gradient(145deg, #fff0bf, #ffe38a);
        border-color: #f2d873;
      }
      .btn.dark {
        background: linear-gradient(145deg, #dfe7f5, #c9d6ec);
        border-color: #b9c8e2;
      }
      .btn.start {
        background: linear-gradient(145deg, #d7f5e4, #bcecd0);
        border-color: #a9e6c2;
        color: #1f7a4d;
      }
      .btn.pause {
        background: linear-gradient(145deg, #ffe8d0, #ffd6a8);
        border-color: #f5b478;
        color: #9a5a1a;
      }
      .btn.start.on {
        background: linear-gradient(145deg, #54c48a, #3fb87a);
        border-color: transparent;
        color: #fff;
        box-shadow: 0 8px 18px rgba(84, 196, 138, 0.4);
      }
      .btn.pause.on {
        background: linear-gradient(145deg, #ffb02e, #ff8f3d);
        border-color: transparent;
        color: #fff;
        box-shadow: 0 8px 18px rgba(255, 143, 61, 0.35);
      }

      .reading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 0;
        border-bottom: 2px dashed var(--line);
      }
      .reading:last-child {
        border-bottom: none;
      }
      .reading .k {
        font-size: 13.5px;
        color: var(--mut);
      }
      .reading .v {
        font-family: var(--head);
        font-size: 13px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .meter {
        height: 16px;
        border-radius: 10px;
        background: #eef3fa;
        position: relative;
        overflow: hidden;
        margin: 8px 0 4px;
        border: 2px solid var(--line);
      }
      .meter .fill {
        position: absolute;
        inset: 0 auto 0 0;
        border-radius: 10px;
        transition:
          width 0.15s,
          background 0.3s;
      }
      .meter .thr {
        position: absolute;
        top: -4px;
        bottom: -4px;
        width: 3px;
        background: var(--warn);
        border-radius: 3px;
      }
      .meterlabels {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--dim);
        margin-top: 4px;
      }

      .badge {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 13px;
        border-radius: 16px;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.5px;
        justify-content: center;
        margin-top: 8px;
      }
      .b-safe {
        background: #e5f8ee;
        color: #2f9e69;
        border: 2px solid #b8ecce;
      }
      .b-danger {
        background: #ffe9ec;
        color: #e0455e;
        border: 2px solid #ffc4ce;
      }
      .b-warn {
        background: #fff3e0;
        color: #b5690a;
        border: 2px solid #ffd699;
      }

      .action {
        margin-top: 14px;
        padding: 16px;
        border-radius: 16px;
        background: linear-gradient(145deg, #fff7fa, #eef6ff);
        border: 2px solid var(--line);
        text-align: center;
      }
      .action .lab {
        font-size: 11px;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        color: var(--dim);
        font-weight: 600;
      }
      .action .big {
        font-size: 18px;
        font-weight: 700;
        margin-top: 6px;
        letter-spacing: 0.3px;
      }
    </style>

    html { background: #1c2249; }
    body { background: #1c2249 var(--bp) center / cover no-repeat fixed !important; }

    /* title sits on the sheet */
    .title h1 {
      color: #eef2ff !important;
      text-shadow: 0 1px 3px rgba(0, 0, 0, .45);
    }
    .title p { color: rgba(214, 224, 255, .82) !important; }

    /* modules: the same sheet seen through a tint so text stays readable */
    .card {
      background:
        linear-gradient(rgba(14, 17, 44, .74), rgba(14, 17, 44, .74)) fixed,
        #1c2249 var(--bp) center / cover no-repeat fixed !important;
      border-color: rgba(140, 160, 255, .3) !important;
      box-shadow: 0 10px 28px rgba(0, 0, 0, .35) !important;
      --txt: #e8ecff;
      --mut: rgba(220,228,255,.8);
      --dim: rgba(220,228,255,.56);
      --line: rgba(140,160,255,.25);
      --panel2: rgba(8,10,30,.45);
      --accent: #ff9fb8;
      color: var(--txt);
    }
    .card::-webkit-scrollbar { width: 8px; }
    .card::-webkit-scrollbar-thumb { background: rgba(232, 220, 192, .25); border-radius: 4px; }

    /* buttons keep the original light palette inside the dark modules */
    .card button,
    .card .btn {
      --txt: #25324a;
      --mut: #5f6f8a;
      --dim: #93a2ba;
      --line: #dbe6f5;
      --panel2: #f4f8ff;
      --accent: #ff8fab;
      --panel: #ffffff;
    }
    .card h3 { color: var(--txt) !important; }
    .action {
      --txt: #25324a;
      --mut: #5f6f8a;
      --dim: #93a2ba;
      --line: #dbe6f5;
      --panel2: #f4f8ff;
      --accent: #ff8fab;
      --panel: #ffffff;
      color: #25324a;
    }
  </style>

    <script>
      (() => {
        "use strict";
        const cv = document.getElementById("stage"),
          g = cv.getContext("2d");
        const W = cv.width,
          H = cv.height,
          GROUND = 372;
        const HOME_X = Math.round(W * 0.42); // bot's home spot, centred between two bushes
        const BURROW_X = Math.round(W * 0.9); // burrow far to the right
        const SENSOR = { x: HOME_X, y: GROUND - 6 }; // radar sensor location
        const BUSHES = [
          { x: Math.round(W * 0.06), s: 1.05 },
          { x: Math.round(W * 0.14), s: 0.95 },
          { x: Math.round(W * 0.22), s: 1.2 }, // LEFT flank
          { x: Math.round(W * 0.62), s: 1.2 }, // RIGHT flank
          { x: Math.round(W * 0.7), s: 1.05 },
          { x: Math.round(W * 0.8), s: 0.95 },
        ];
        const PXCM = 1.5; // px-per-cm scale for the ultrasonic tab
        // Vertical forest trail (ultrasonic tab): bot walks TOP -> BOTTOM toward a burrow at the far end,
        // with trees/bushes lining both sides. A gentler, lower-angle perspective (wider far end, shorter
        // "distant sky") and a soft curve down the middle so it reads as a real path, not a centred wedge.
        const CX = Math.round(W * 0.5),
          TRAIL_Y0 = 130,
          TRAIL_Y1 = 330,
          BURROW_Y = TRAIL_Y1 + 40;
        const PATH_TOP_W = 126,
          PATH_BOT_W = 198;
        function pathT(y) {
          return Math.max(
            0,
            Math.min(1, (y - TRAIL_Y0) / (TRAIL_Y1 - TRAIL_Y0)),
          );
        }
        function pathHalfWidthAt(y) {
          const tt = pathT(y);
          return (PATH_TOP_W + (PATH_BOT_W - PATH_TOP_W) * tt) / 2;
        }
        // Off-centre, asymmetric wander instead of a symmetric bulge that snaps back to dead-centre at
        // both ends — a real trail drifts to one side, not a mirrored wedge. Two sine harmonics at
        // different frequencies/phases keep it from ever reading as a straight centred line.
        function pathCenterXAt(y) {
          const tt = pathT(y);
          // A late, sharply-ramping bias (negligible until tt is close to 1) pulls the very end of
          // the trail the rest of the way into the bottom-right corner, where the tree house sits,
          // without disturbing the wander through the rest of the walk.
          const cornerPull = Math.pow(tt, 4) * 150;
          return (
            CX -
            34 +
            92 * tt +
            Math.sin(tt * Math.PI) * 58 +
            Math.sin(tt * Math.PI * 2.4 + 0.6) * 14 +
            cornerPull
          );
        }
        // Small deterministic wobble applied to each edge independently (different phase per side) so
        // the dirt boundary looks worn/uneven rather than a mathematically perfect parallel curve.
        function edgeJitter(y, phase) {
          const tt = pathT(y);
          return (
            Math.sin(tt * 9 + phase) * 3.2 +
            Math.sin(tt * 17 + phase * 1.8) * 1.6
          );
        }
        function depthScale(y) {
          const tt = pathT(y);
          return 0.65 + 0.55 * tt;
        }
        // Bushes only, no trees, immediately hugging the path edges — trees that close to the
        // trail were crowding it and made the dirt hard to read; low bushes keep the border green
        // without blocking the view down the path (bigger trees still frame the scene further out
        // via FILLER_PROPS/WALL_PROPS/TOP_TREELINE).
        const SIDE_PROPS = [];
        for (let i = 0; i < 15; i++) {
          const py = TRAIL_Y0 + 16 + i * ((TRAIL_Y1 - TRAIL_Y0 - 10) / 14),
            hw = pathHalfWidthAt(py),
            cxp = pathCenterXAt(py);
          SIDE_PROPS.push({
            x: cxp - hw - 14 - Math.random() * 16,
            y: py + (Math.random() * 10 - 5),
            type: "bush",
          });
          SIDE_PROPS.push({
            x: cxp + hw + 14 + Math.random() * 16,
            y: py + (Math.random() * 10 - 5),
            type: "bush",
          });
        }
        const PATH_SPECKS = [];
        for (let i = 0; i < 26; i++) {
          PATH_SPECKS.push({
            ty: TRAIL_Y0 + 10 + Math.random() * (TRAIL_Y1 - TRAIL_Y0 + 30),
            dx: (Math.random() * 2 - 1) * 0.75,
            leaf: Math.random() < 0.5,
            rot: Math.random() * 3,
          });
        }
        // Background filler foliage: fleshes out the ground on both sides of the path so nothing
        // reads as flat empty space between the path-hugging props and the corner trees. Trees
        // get a much higher size floor than bushes — no tiny toy-sized trees anywhere, even up
        // near the horizon where depth scaling alone would otherwise shrink them down small. Kept
        // an extra step further off the path edge than before, especially lower down (bigger, near
        // trees), so a dense canopy still leaves the path itself as the clear, uncluttered feature.
        // Doubled the count and biased heavily toward (tall) trees over bushes so there's no bare
        // negative space left anywhere off the path — the trail is the only thing kept clear.
        const FILLER_PROPS = [];
        for (let i = 0; i < 260; i++) {
          const y = TRAIL_Y0 - 70 + Math.random() * (H - TRAIL_Y0 + 90);
          const cy = Math.max(TRAIL_Y0, Math.min(TRAIL_Y1, y));
          const hw = pathHalfWidthAt(cy),
            cxp = pathCenterXAt(cy),
            side = Math.random() < 0.5 ? -1 : 1;
          const nearness = depthScale(cy); // 0.65 (far/top) .. 1.2 (near/bottom)
          const clearance = 24 + nearness * 26; // keeps bigger, closer trees further from the path edge
          const x = cxp + side * (hw + clearance + Math.random() * (W * 0.55));
          const type = Math.random() < 0.28 ? "bush" : "tree";
          if (x > -10 && x < W + 10)
            FILLER_PROPS.push({
              x,
              y,
              s:
                type === "tree"
                  ? 0.85 + Math.random() * 0.65
                  : 0.4 + Math.random() * 0.5,
              type,
            });
        }
        // A guaranteed solid tree line hugging each canvas edge, top to bottom — the random filler
        // above can leave lucky gaps, this makes sure the sides always read as "full of tall
        // trees", with the same no-tiny-trees floor as the filler above. Denser rows and a heavier
        // tree bias than before.
        const WALL_PROPS = [];
        for (let i = 0; i < 15; i++) {
          const y = TRAIL_Y0 - 50 + i * ((H - TRAIL_Y0 + 90) / 14);
          const typeL = Math.random() < 0.2 ? "bush" : "tree",
            typeR = Math.random() < 0.2 ? "bush" : "tree";
          WALL_PROPS.push({
            x: 8 + Math.random() * 24,
            y: y + (Math.random() * 14 - 7),
            s:
              typeL === "tree"
                ? 0.8 + Math.random() * 0.5
                : 0.4 + Math.random() * 0.4,
            type: typeL,
          });
          WALL_PROPS.push({
            x: W - 8 - Math.random() * 24,
            y: y + (Math.random() * 14 - 7),
            s:
              typeR === "tree"
                ? 0.8 + Math.random() * 0.5
                : 0.4 + Math.random() * 0.4,
            type: typeR,
          });
        }
        // A denser, more imposing treeline right along the top edge specifically — reinforces that
        // the FAR end of the trail (the "high" part of the frame) is where the forest is thickest,
        // the near/bottom foreground stays comparatively open around the path.
        const TOP_TREELINE = [];
        for (let i = 0; i < 13; i++) {
          const x = 30 + i * ((W - 60) / 12) + (Math.random() * 16 - 8);
          const y = TRAIL_Y0 - 55 + Math.random() * 30;
          const hw = pathHalfWidthAt(TRAIL_Y0);
          if (Math.abs(x - pathCenterXAt(TRAIL_Y0)) < hw + 20) continue; // leave the trail mouth clear
          TOP_TREELINE.push({ x, y, s: 0.85 + Math.random() * 0.35 });
        }
        // Fine ground texture (grass tufts) across the whole floor for extra fill, cheap to draw.
        const GROUND_SPECKS = [];
        for (let i = 0; i < 90; i++) {
          GROUND_SPECKS.push({
            x: Math.random() * W,
            y: TRAIL_Y0 - 40 + Math.random() * (H - TRAIL_Y0 + 60),
            h: 4 + Math.random() * 7,
            rot: Math.random() * 0.6 - 0.3,
          });
        }
        const NUT_Y = TRAIL_Y0 + (TRAIL_Y1 - TRAIL_Y0) * 0.4,
          NUT_PAUSE = 280; // where the bot stops for a snack, and how long (frames)

        /* ---------- STATE ---------- */
        let sensor = "light",
          t = 0;
        const P = {
          light: { sunlight: 85, threshold: 45 },
          motion: { range: 150, speed: 1.2 },
          ultra: { safe: 30, range: 110, size: 1 },
        };
        let paused = true,
          started = false; // ultrasonic-tab run state
        let motionSelectedDir = "away"; // Motion Sensor tab: which direction is armed, chosen in the left panel before pressing Send Threat
        let human = {
          x: W + 60,
          y: GROUND - 6,
          vx: 0,
          vy: 0,
          mode: "away",
          active: false,
          entered: false,
          face: -1,
          fromSide: "right",
          frozen: false,
          scale: 1,
          willReturn: false,
          returned: false,
          turnX: 0,
        };
        let cloud = -280;
        let bird = {
          active: false,
          x: -90,
          y: 100,
          vx: 1,
          vy: 0,
          phase: "cruise",
          timer: 0,
          targetX: 0,
          cruiseY: 100,
        };
        let birdThreat = false;
        const rab = {
          x: HOME_X,
          y: GROUND - 8,
          state: "eating",
          hop: 0,
          dip: 0,
          chew: 0,
          face: 1,
          dir: 1,
          tx: HOME_X,
          ty: 0,
          hide: "burrow",
          bush: 1,
          hideProp: 0,
          tilt: 0,
          blockT: 0,
          ateNut: false,
          eatT: 0,
        };
        let obstacles = []; // ultrasonic-tab obstacles on the trail — {x,y,size}, as many as the learner adds
        // Ultrasonic ping/echo animation state: a pulse repeatedly travels OUT from the bot, and either
        // bounces BACK the moment it reaches an obstacle (an echo — this is how a real ultrasonic sensor
        // times a round trip to compute distance) or fades once it passes the detection range unanswered.
        let ping = {
          dist: 0,
          phase: "out",
          speed: 6.5,
          echoFlash: 0,
          fadeT: 0,
          lastDist: null,
        };
        /* ---------- PARAM DEFS ---------- */
        const DEFS = {
          light: {
            title: "LDR Sensor",
            sub: "The bot watches the light. If it gets dark (below the danger line) OR a predator’s shadow passes over it, the bot runs to the burrow. When it is bright and clear, it eats its carrot.",
            controls: [
              [
                "sunlight",
                "Light Intensity",
                0,
                100,
                1,
                (v) => v + " %",
                "Slide to make it brighter or darker",
              ],
              [
                "threshold",
                "Shadow Threshold",
                10,
                90,
                1,
                (v) => v + " %",
                "If light drops below this, the bot detects danger",
              ],
            ],
          },
          motion: {
            title: "Motion Sensor",
            sub: "The bot watches for movement. If a moving threat walks TOWARD it and enters the detection zone, it hops to the nearest bush and hides. If the threat walks away, it keeps eating.",
            controls: [
              [
                "range",
                "Detection Range",
                80,
                300,
                5,
                (v) => v + " cm",
                "Size of the radar ring around the bot",
              ],
              [
                "speed",
                "Threat Speed",
                0.5,
                3,
                0.1,
                (v) => v.toFixed(1) + " ×",
                "How fast the threat approaches",
              ],
            ],
          },
          ultra: {
            title: "Ultrasonic Sensor",
            sub: "The bot walks slowly down a forest trail toward its tree house, pinging sound waves ahead of it. Set the size below, then click the trail to drop an obstacle — click an obstacle again to remove it. Get too close to one and the bot darts off the trail into the nearest tree or bush. Press Reset to send it down the trail again.",
            controls: [
              [
                "safe",
                "Safe Distance Limit",
                10,
                90,
                1,
                (v) => v + " cm",
                "Minimum gap the bot needs before it reacts",
              ],
              [
                "range",
                "Detection Range",
                40,
                160,
                5,
                (v) => v + " cm",
                "How far ahead the sensor can sense anything at all",
              ],
              [
                "size",
                "Obstacle Size",
                0.6,
                1.8,
                0.1,
                (v) => v.toFixed(1) + " ×",
                "Size of the next obstacle you add",
              ],
            ],
          },
        };

        /* ---------- UI: CONTROLS PANEL ---------- */
        const controlsEl = document.getElementById("controls"),
          footEl = document.getElementById("foot");
        function buildControls() {
          const titleEl = document.getElementById("paramTitle"),
            subEl = document.getElementById("paramSub");
          controlsEl.innerHTML = "";
          {
            const d = DEFS[sensor];
            titleEl.textContent = d.title;
            subEl.textContent = d.sub;
            d.controls.forEach(([key, label, min, max, step, fmt, hint]) => {
              const val = P[sensor][key];
              const w = document.createElement("div");
              w.className = "ctrl";
              w.innerHTML = `<div class="row"><label>${label}</label><span class="val" id="v_${key}">${fmt(val)}</span></div>
        <input type="range" min="${min}" max="${max}" step="${step}" value="${val}" id="r_${key}">
        <div class="hint">${hint}</div>`;
              controlsEl.appendChild(w);
              const inp = w.querySelector("input");
              const fill = () =>
                inp.style.setProperty(
                  "--fill",
                  ((inp.value - min) / (max - min)) * 100 + "%",
                );
              fill();
              inp.addEventListener("input", () => {
                P[sensor][key] = parseFloat(inp.value);
                document.getElementById("v_" + key).textContent = fmt(
                  parseFloat(inp.value),
                );
                fill();
              });
            });
            if (sensor === "motion") {
              const w = document.createElement("div");
              w.className = "ctrl";
              w.innerHTML = `<div class="row"><label>Threat Direction</label></div>
        <div class="toggle"><button id="tgToward">Threat Toward</button><button id="tgAway">Threat Away</button></div>
        <div class="hint">Choose a direction, then press “Send Threat” below the stage to release it.</div>`;
              controlsEl.appendChild(w);
              document.getElementById("tgToward").onclick = () => {
                motionSelectedDir = "toward";
                updateThreatDirButtons();
              };
              document.getElementById("tgAway").onclick = () => {
                motionSelectedDir = "away";
                updateThreatDirButtons();
              };
              updateThreatDirButtons();
            }
          }
          buildFoot();
        }
        const ROUTES = [
          { sx: W + 50, sy: GROUND - 6 },
          { sx: -50, sy: GROUND - 6 },
          { sx: W + 50, sy: H - 28 },
          { sx: -50, sy: H - 28 },
          // from behind the bot — spawns up near the horizon and walks down through the scene,
          // instead of only ever entering from the left or right edge
          { sx: HOME_X - 90, sy: 96 },
          { sx: HOME_X + 70, sy: 100 },
          { sx: HOME_X - 10, sy: 90 },
        ];
        // "Away" paths must never come this close to the sensor at their nearest point — keeps
        // the threat from ever visibly walking through or touching the bot while still letting
        // a big enough Detection Range reach out and catch it, same as a real motion sensor would.
        const AWAY_MIN_CLEARANCE = 70;
        function setDir(mode) {
          rab.x = HOME_X;
          rab.y = GROUND - 8;
          rab.state = "eating";
          rab.dip = 0;
          rab.hop = 0;
          rab.face = 1;
          rab.tx = HOME_X;
          if (mode === "toward") {
            const r = ROUTES[Math.floor(Math.random() * ROUTES.length)];
            human.x = r.sx;
            human.y = r.sy;
            human.scale = 1;
            human.fromSide = r.sx < W / 2 ? "left" : "right";
            const dx = SENSOR.x - human.x,
              dy = SENSOR.y - human.y,
              L = Math.hypot(dx, dy);
            human.vx = dx / L;
            human.vy = dy / L;
            human.face = human.vx < 0 ? -1 : 1;
            human.mode = "toward";
            human.active = true;
            human.entered = false;
            human.frozen = false;
          } else if (Math.random() < 0.4) {
            // Also from behind, same as "Toward" now can — but "Away" must still mean not heading
            // AT the bot: spawn off to one side of the sensor by at least AWAY_MIN_CLEARANCE and
            // keep drifting a little further that way while walking down, so the path passes
            // beside the bot, never through it. Offset + drift are kept small enough that turning
            // Detection Range up still reliably lets it get caught.
            const farLeft = Math.random() < 0.5;
            const offset = AWAY_MIN_CLEARANCE + Math.random() * 70;
            const startX = Math.max(
              20,
              Math.min(W - 20, farLeft ? HOME_X - offset : HOME_X + offset),
            );
            human.x = startX;
            human.y = 88 + Math.random() * 20;
            human.scale = 1.06;
            const drift = (farLeft ? -1 : 1) * (0.03 + Math.random() * 0.06); // keeps moving away from the sensor's x, never toward it, but only gently
            const L = Math.hypot(drift, 1);
            human.vx = drift / L;
            human.vy = 1 / L;
            human.face = human.vx < 0 ? -1 : 1;
            human.fromSide = farLeft ? "left" : "right";
            human.mode = "away";
            human.active = true;
            human.entered = true;
            human.frozen = false;
            human.willReturn = false;
            human.returned = false;
            human.turnX = 0;
          } else {
            const fromLeft = Math.random() < 0.5;
            // A horizontal lane, but never one that passes within AWAY_MIN_CLEARANCE of the
            // sensor's own height — otherwise the crossing point (where the path's x lines up
            // with the bot) would bring it right up against the bot. Picks either a lane set back
            // toward the horizon or one down in the near foreground, both comfortably clear.
            const useBack = Math.random() < 0.6;
            const laneY = useBack
              ? 130 +
                Math.random() *
                  Math.max(20, SENSOR.y - AWAY_MIN_CLEARANCE - 130)
              : SENSOR.y +
                AWAY_MIN_CLEARANCE +
                Math.random() *
                  Math.max(4, H - 16 - (SENSOR.y + AWAY_MIN_CLEARANCE));
            human.x = fromLeft ? -60 : W + 60;
            human.y = laneY;
            human.scale = 1.06;
            human.vx = fromLeft ? 1 : -1;
            human.vy = 0;
            human.face = human.vx < 0 ? -1 : 1;
            human.fromSide = fromLeft ? "left" : "right"; // so oppositeBush() still picks correctly if this "away" stroll ever trips the sensor
            human.mode = "away";
            human.active = true;
            human.entered = false;
            human.frozen = false;
            // About half the time, turn around partway across instead of always walking straight through
            // and vanishing — so the person sometimes comes back the way they came.
            human.willReturn = Math.random() < 0.5;
            human.returned = false;
            human.turnX = W * 0.32 + Math.random() * W * 0.36;
          }
        }
        function buildFoot() {
          if (sensor === "light") {
            footEl.innerHTML = `<button class="btn sun" id="fSun">☀️ Make it Sunny</button>
      <button class="btn dark" id="fDark">☁️ Cast a Shadow</button>
      <button class="btn" id="fBird" style="background:linear-gradient(145deg,#e9e0ff,#cfc0ff);border-color:#c1b0ff">🦅 Send Predator</button>
      <button class="btn" id="fReset">↺ Reset</button>`;
            document.getElementById("fSun").onclick = () =>
              setSlider("sunlight", 95);
            document.getElementById("fDark").onclick = () =>
              setSlider("sunlight", 22);
            document.getElementById("fBird").onclick = sendBird;
          } else if (sensor === "motion") {
            footEl.innerHTML = `<button class="btn" id="fSendThreat" style="background:linear-gradient(145deg,#ffd7de,#ffbcc7);border-color:#ffb0bd">🚶 Send Threat</button>
      <button class="btn" id="fReset">↺ Reset</button>`;
            document.getElementById("fSendThreat").onclick = () =>
              setDir(motionSelectedDir);
          } else {
            // ultra
            footEl.innerHTML = `<button class="btn start" id="fStart">▶ Start</button>
      <button class="btn pause" id="fPause">⏸ Pause</button>
      <button class="btn" id="fClearObs" style="background:linear-gradient(145deg,#dceafc,#c3daf6);border-color:#b3cdee">🧹 Clear All</button>
      <button class="btn" id="fReset">↺ Reset</button>`;
            document.getElementById("fStart").onclick = () => {
              started = true;
              setPaused(false);
            };
            document.getElementById("fPause").onclick = () => setPaused(true);
            document.getElementById("fClearObs").onclick = clearObstacle;
            setPaused(paused);
          }
          document.getElementById("fReset").onclick = reset;
        }
        function setSlider(key, v) {
          const r = document.getElementById("r_" + key);
          if (r) {
            r.value = v;
            r.dispatchEvent(new Event("input"));
          }
        }
        // Reflects the armed-but-not-yet-sent direction in the left panel toggle — separate from
        // setDir(), which only fires once "Send Threat" is actually pressed below the stage.
        function updateThreatDirButtons() {
          const a = document.getElementById("tgToward"),
            b = document.getElementById("tgAway");
          if (a && b) {
            a.className = motionSelectedDir === "toward" ? "on" : "";
            b.className = motionSelectedDir === "away" ? "on safe" : "";
          }
        }
        function setPaused(v) {
          paused = v;
          const s = document.getElementById("fStart"),
            p = document.getElementById("fPause");
          if (s && p) {
            s.classList.toggle("on", !paused);
            p.classList.toggle("on", paused);
          }
        }
        function sendBird() {
          const r = Math.floor(Math.random() * 4);
          const fromLeft = r % 2 === 0;
          bird.cruiseY = 88 + Math.random() * 30;
          bird.x = fromLeft ? -90 : W + 90;
          bird.vx = fromLeft ? 1 : -1;
          bird.y = r < 2 ? bird.cruiseY : 66;
          bird.vy = r < 2 ? 0 : 0.18;
          bird.phase = "cruise";
          bird.timer = 0;
          bird.targetX = 0;
          bird.active = true;
          birdThreat = false;
        }
        function reset() {
          rab.y = GROUND - 8;
          rab.dip = 0;
          rab.hop = 0;
          rab.tilt = 0;
          rab.blockT = 0;
          if (sensor === "ultra") {
            rab.state = "walking";
            rab.x = CX;
            rab.y = TRAIL_Y0;
            rab.face = 1;
            rab.ateNut = false;
            rab.eatT = 0;
            rab.pauseT = 0;
          } else {

        // Ghost preview under the cursor so a learner can see, before clicking, whether they're

        // Draws the ping/echo pulse described in `ping` (see updatePing): a burst that visibly travels
        // OUT from the bot's nose, and — only if it actually reaches an obstacle within range — snaps
        // BACK to the sensor as an echo, flashing "ECHO" with the measured distance the instant it
        // arrives. That round trip (out, then back) is literally how a real ultrasonic sensor times a
        // distance, so this makes the calculation itself visible instead of just the final number.
        // `target` is the obstacle nearestObstacleAhead() is currently tracking (or null). The
        // whole ping — corridor line, travelling pulse, wavefront arc — now points straight at
        // it, whichever way it sits, instead of always aiming straight down. With nothing to
        // aim at, it defaults to a straight-ahead search line.
        function drawUltraPing(x0, y0, level, live, target) {
          const color =
            level <= 1
              ? "63,214,196"
              : level === 2
                ? "255,190,60"
                : "255,90,110";
          let dx = 0,
            dy = 1;
          if (target) {
            const ddx = target.x - x0,
              ddy = target.y - y0,
              L = Math.hypot(ddx, ddy) || 1;
            dx = ddx / L;
            dy = ddy / L;
          }
          const ang = Math.atan2(dy, dx);
          const maxPx = P.ultra.range * PXCM;
          g.save();
          // faint corridor showing the sensor's full detection reach, aimed at whatever it's
          // currently tracking — visible even before Start, so the Detection Range slider means
          // something while the learner is still setting it up
          g.strokeStyle = `rgba(${color},.22)`;
          g.lineWidth = 1.5;
          g.setLineDash([4, 6]);
          g.beginPath();
          g.moveTo(x0, y0);
          g.lineTo(x0 + dx * maxPx, y0 + dy * maxPx);
          g.stroke();
          g.setLineDash([]);
          if (!live) {
            g.restore();
            return;
          }
          if (ping.phase !== "fade") {
            const wx = x0 + dx * ping.dist,
              wy = y0 + dy * ping.dist;
            const arcColor = ping.phase === "back" ? "255,255,255" : color;
            g.shadowColor = `rgba(${color},.85)`;
            g.shadowBlur = 8;
            g.strokeStyle = `rgba(${arcColor},.9)`;
            g.lineWidth = ping.phase === "back" ? 3.2 : 2.6;
            g.save();
            g.translate(wx, wy);
            g.rotate(ang - Math.PI / 2);
            g.beginPath();
            g.arc(0, 0, 11, Math.PI / 2 - 0.55, Math.PI / 2 + 0.55);
            g.stroke();
            g.restore();
            // a couple of soft trailing arcs behind the leading edge, direction matches travel
            for (let i = 1; i <= 2; i++) {
              const td =
                ping.phase === "back" ? ping.dist + i * 9 : ping.dist - i * 9;
              if (td < 0 || td > maxPx) continue;
              g.globalAlpha = 0.35 / i;
              g.save();
              g.translate(x0 + dx * td, y0 + dy * td);
              g.rotate(ang - Math.PI / 2);
              g.beginPath();
              g.arc(0, 0, 11, Math.PI / 2 - 0.5, Math.PI / 2 + 0.5);
              g.stroke();
              g.restore();
            }
            g.globalAlpha = 1;
            g.shadowBlur = 0;
          }
          if (ping.echoFlash > 0) {
            const p = ping.echoFlash / 16;
            g.globalAlpha = p;
            g.fillStyle = "#ffffff";
            g.beginPath();
            g.arc(x0, y0, 6 + (1 - p) * 14, 0, 7);
            g.fill();
            g.globalAlpha = 1;
            if (ping.lastDist != null) {
              g.font = "700 11px Orbitron, sans-serif";
              g.textAlign = "center";
              g.fillStyle = `rgba(${color},${p})`;
              g.fillText("ECHO · " + ping.lastDist + " cm", x0, y0 - 14);
              g.textAlign = "left";
            }
          }
          g.restore();
        }

        /* ---------- READINGS PANELS ---------- */

            )
            .join("");
          document.getElementById("meterWrap").style.display = "block";
          const f = document.getElementById("meterFill");
          f.style.width = Math.max(0, Math.min(100, o.L)) + "%";
          f.style.background = o.danger
            ? "linear-gradient(90deg,#ff6b81,#ff9aa8)"
            : "linear-gradient(90deg,#7cc6ff,#54c48a)";
          const thr = document.getElementById("meterThr");
          thr.style.display = "block";
          thr.style.left = P.light.threshold + "%";
          document.getElementById("meterLbl").textContent = "light";
          const badge = document.getElementById("badge");
          badge.className = "badge " + (o.danger ? "b-danger" : "b-safe");
          document.getElementById("badgeText").textContent = o.danger
            ? "SHADOW DETECTED — DANGER!"
            : "NO SHADOW — SAFE";
          const spot = rab.hide === "burrow" ? "burrow" : "bush",
            spotIcon = rab.hide === "burrow" ? "🕳️" : "🌿";
          const act = {
            eating: "Eating a carrot 🥕",
            fleeing: "Escaping to the " + spot + " 🏃",
            hiding: "Hiding in the " + spot + " " + spotIcon,
            returning: "Coming back out 🐇",
          }[rab.state];
          document.getElementById("actText").textContent = act;
        }
        function renderMotionReadings(o) {
          const dirTxt = human.frozen
            ? "Frozen 🥶"
            : human.mode === "toward"
              ? "Coming closer ➡️"
              : "Walking away ⬅️";
          const threatLvl = !o.onField
            ? "None"
            : o.dist > P.motion.range * 0.66
              ? "Low"
              : o.dist > P.motion.range * 0.33
                ? "Medium"
                : "High";
          const rows = [
            ["Threat Distance", o.onField ? o.dist + " cm" : "far away"],
            ["Detection Range", P.motion.range + " cm"],
            ["Motion Detected", o.danger ? "Yes" : "No"],
            ["Threat Level", threatLvl],
            ["Direction", dirTxt],
          ];
          readingsEl.innerHTML = rows
            .map(
              (r) =>
                `<div class="reading"><span class="k">${r[0]}</span><span class="v">${r[1]}</span></div>`,
            )
            .join("");
          document.getElementById("meterWrap").style.display = "block";
          const meter = o.onField
            ? Math.max(0, 100 - (o.dist / P.motion.range) * 100)
            : 0;
          const f = document.getElementById("meterFill");
          f.style.width = Math.max(0, Math.min(100, meter)) + "%";
          f.style.background = o.danger
            ? "linear-gradient(90deg,#ff6b81,#ff9aa8)"
            : "linear-gradient(90deg,#7cc6ff,#54c48a)";
          document.getElementById("meterThr").style.display = "none";
          document.getElementById("meterLbl").textContent = "closeness";
          const badge = document.getElementById("badge");
          badge.className = "badge " + (o.danger ? "b-danger" : "b-safe");
          document.getElementById("badgeText").textContent = o.danger
            ? "MOTION NEAR — DANGER!"
            : "ALL SAFE";
          const spot = rab.hide === "burrow" ? "burrow" : "bush";
          const act = {
            eating: "Eating a carrot 🥕",
            fleeing: "Turning and escaping to the " + spot + " 🏃",
            hiding: "Hiding in the " + spot + " 🌿",
            returning: "Coming back out 🐇",
          }[rab.state];
          document.getElementById("actText").textContent = act;
        }
        function renderUltraReadings(info) {
          const distTxt = info.detected
            ? Math.round(info.distCm) + " cm"
            : info.distCm != null
              ? "out of range"
              : "—";
          const rows = [
            ["Obstacle Distance", distTxt],
            ["Safe Distance", P.ultra.safe + " cm"],
            ["Detection Range", P.ultra.range + " cm"],
            ["Obstacle Detected", info.detected ? "Yes" : "No"],
          ];
          readingsEl.innerHTML = rows
            .map(
              (r) =>
                `<div class="reading"><span class="k">${r[0]}</span><span class="v">${r[1]}</span></div>`,
            )
            .join("");
          document.getElementById("meterWrap").style.display = "block";
          const meter = info.detected
            ? Math.max(0, 100 - (info.distCm / P.ultra.range) * 100)
            : 0;
          const f = document.getElementById("meterFill");
          f.style.width = meter + "%";
          f.style.background =
            info.level === 3
              ? "linear-gradient(90deg,#ff6b81,#ff9aa8)"
              : info.level === 2
                ? "linear-gradient(90deg,#ffb02e,#ffd28a)"
                : "linear-gradient(90deg,#7cc6ff,#54c48a)";
          const thr = document.getElementById("meterThr");
          thr.style.display = "block";
          thr.style.left =
            Math.max(0, 100 - (P.ultra.safe / P.ultra.range) * 100) + "%";
          document.getElementById("meterLbl").textContent = "closeness";
          const decision =
            rab.state === "hiding"
              ? "Hidden — Safe"
              : rab.state === "arrived"
                ? "Reached Tree House"
                : info.level === 3
                  ? "Path Blocked"
                  : info.level === 2
                    ? "Caution"
                    : "Path Clear";
          const badge = document.getElementById("badge");
          badge.className =
            "badge " +
            (rab.state === "hiding" || rab.state === "arrived"
              ? "b-safe"
              : info.level === 3
                ? "b-danger"
                : info.level === 2
                  ? "b-warn"
                  : "b-safe");
          const sensing = rab.state === "walking" || rab.state === "nutbreak";
          document.getElementById("badgeText").textContent = !started
            ? "READY"
            : decision.toUpperCase() +
              (info.detected && sensing
                ? ""
                : sensing
                  ? " — NOTHING IN RANGE"
                  : "");
          const actText = document.getElementById("actText");
          if (!started)
            actText.textContent = "Set the sliders, then press Start ▶";
          else if (paused) actText.textContent = "Paused";
          else
            actText.textContent =
              {
                walking: "Walking down the trail 🐇",
                nutbreak: "Stopped for a snack 🌰",
                fleeing: "Darting for cover! 🏃",
                hiding: "Hiding behind the bush 🌿",
                arrived: "Made it home safely 🏠",
              }[rab.state] || "Walking down the trail 🐇";
        }
        /* ---------- MAIN LOOP ---------- */
        function loop() {
          t++;
          g.clearRect(0, 0, W, H);
          if (sensor === "light") {
            updateBird();
            const o = computeLight();
            if (o.dark) {
              if (cloud < -170) cloud = -280;
              cloud += 0.7;
              if (cloud > W + 60) cloud = W + 60;
            } else {
              cloud -= 1.6;
              if (cloud < -280) cloud = -280;
            }
            let hideType = "burrow",
              hideX = BURROW_X,
              bushIdx = -1;
            if (birdThreat) {
              const h = nearestHideout();
              hideType = h.type;
              hideX = h.x;
              bushIdx = h.bush;
            }
            fleeStep(o.danger, hideType, hideX, bushIdx, 1.15);
            scene(o.dark);
            if (cloud > -170) shadowCloud(cloud);
            drawBird();
            const hidden = rab.state === "hiding";
            if (!hidden) drawRabbit();
            if (hidden) {
              if (rab.hide === "burrow") drawBurrowHidden();
              else drawBush(BUSHES[rab.bush]);
            } else if (rab.dip > 3) {
              if (rab.hide === "burrow") drawBurrowFront();
              else drawBush(BUSHES[rab.bush]);
            }
            renderLightReadings(o);
          } else if (sensor === "motion") {
            const o = computeMotion();
            if (human.active) {
              human.frozen = o.inside;
              if (!o.inside) {
                human.x += human.vx * P.motion.speed * 1.15;
                human.y += human.vy * P.motion.speed * 1.15;
              }
              if (
                human.mode === "away" &&
                human.willReturn &&
                !human.returned &&
                ((human.vx > 0 && human.x >= human.turnX) ||
                  (human.vx < 0 && human.x <= human.turnX))
              ) {
                human.vx = -human.vx;
                human.face = human.vx < 0 ? -1 : 1;
                human.fromSide = human.fromSide === "left" ? "right" : "left";
                human.returned = true;
              }
              if (human.x > 0 && human.x < W) human.entered = true;
              if (
                human.entered &&
                (human.x < -70 || human.x > W + 70 || human.y > H + 40)
              ) {
                human.active = false;
                human.mode = "away";
                human.frozen = false;
              }
            }
            let hideX = HOME_X,
              bushIdx = 1;
            if (o.danger) {
              bushIdx = oppositeBush();
              hideX = BUSHES[bushIdx].x;
            }
            fleeStep(o.danger, "bush", hideX, bushIdx, 1.15);
            drawMotionFieldTilted(false);
            drawRingTilted(o.danger);
            const hidden = rab.state === "hiding";
            const humanBehind = human.active && human.y < rab.y; // draw whichever is farther back first, so the person can walk behind the bot instead of always covering it
            if (humanBehind) drawHuman();
            if (!hidden) drawRabbit();
            if (hidden) {
              drawBush(BUSHES[rab.bush]);
            } else if (rab.dip > 3) {
              drawBush(BUSHES[rab.bush]);
            }
            if (!humanBehind) drawHuman();
            renderMotionReadings(o);
          } else {
            // ultra
            const info = ultraStep();
            drawForestScene();
            drawTopCornerTree(1);
            drawTopCornerTree(-1);
            TOP_TREELINE.forEach(drawTopTreelineProp);
            GROUND_SPECKS.forEach(drawGroundSpeck);
            FILLER_PROPS.forEach(drawFillerProp);
            WALL_PROPS.forEach(drawWallProp);
            drawForestPath();
            drawSignpost(
              pathCenterXAt(TRAIL_Y0 + 34) +
                pathHalfWidthAt(TRAIL_Y0 + 34) +
                16,
              TRAIL_Y0 + 34,
              depthScale(TRAIL_Y0 + 34),
            );
            const noseX = rab.x,
              noseY = rab.y - 16;
            const sensing = rab.state === "walking" || rab.state === "nutbreak";
            if (sensing) {
              if (!paused) updatePing();
              const pingTarget = nearestObstacleAhead(noseY);
              drawUltraPing(noseX, noseY, info.level, !paused, pingTarget);
            }
            const drawList = SIDE_PROPS.map((p) => ({
              y: p.y,
              fn: () => drawSideProp(p),
            }));
            if (!rab.ateNut)
              drawList.push({
                y: NUT_Y,
                fn: () =>
                  drawNutIcon(pathCenterXAt(NUT_Y), NUT_Y, depthScale(NUT_Y)),
              });
            obstacles.forEach((o) => {
              drawList.push({
                y: o.y,
                fn: () => drawObstacle(o.x, o.y, depthScale(o.y) * o.size),
              });
            });
            if (rab.state !== "hiding")
              drawList.push({
                y: rab.y,
                fn: () => drawRabbit(depthScale(rab.y)),
              });
            drawList.sort((a, b) => a.y - b.y);
            drawList.forEach((d) => d.fn());
            drawBottomCornerTree(1);
            // No right-side corner tree here — the tree house's own big tree now anchors that
            // corner, and the two used to overlap and crowd right over the final stretch of path.
            drawTreeHouseEnding(
              pathCenterXAt(BURROW_Y),
              BURROW_Y,
              depthScale(TRAIL_Y1),
            );
            drawUltraHover();
            g.font = "600 12px Rajdhani, sans-serif";
            g.textAlign = "left";
            g.fillStyle = "rgba(255,255,255,.6)";
            g.fillText(
              "🪨 Click the trail to add or remove an obstacle",
              14,
              H - 14,
            );
            renderUltraReadings(info);
          }
          requestAnimationFrame(loop);
        }
        function updateBird() {
          if (!bird.active) return;
          if (bird.phase === "cruise") {
            bird.x += bird.vx * 2.4;
            bird.y += bird.vy;
            if (bird.y > 142) bird.y = 142;
            if (bird.x > 0 && bird.x < W && Math.abs(bird.x - rab.x) < 42) {
              birdThreat = true;
              bird.targetX = rab.x;
              bird.phase = "hover";
              bird.timer = 0;
            }
            if (bird.x < -110 || bird.x > W + 110) {
              bird.active = false;
              birdThreat = false;
            }
          } else if (bird.phase === "hover") {
            bird.timer++;
            bird.y += Math.sin(bird.timer * 0.3) * 0.4;
            if (bird.timer > 36) {
              bird.phase = "dive";
              bird.timer = 0;
            }
          } else if (bird.phase === "dive") {
            bird.x += (bird.targetX - bird.x) * 0.06;
            bird.y += (GROUND - 66 - bird.y) * 0.12;
            bird.timer++;
            if (bird.timer > 60) {
              bird.phase = "leave";
            }
          } else {
            bird.y += (bird.cruiseY - bird.y) * 0.08;
            bird.x += bird.vx * 2.8;
            if (bird.x < -120 || bird.x > W + 120) {
              bird.active = false;
              birdThreat = false;
            }
          }
        }
        buildControls();
        loop();
      })();
    </script>
  </body>
</html>
